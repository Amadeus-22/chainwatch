# chainwatch network list (CHAINWATCH_CHAINS_FILE). One indexer runs per entry,
# in the same process. Unknown keys are errors.
#
# rpc_url may reference environment variables as ${VAR}, so provider API keys
# stay out of this file. Any JSON-RPC endpoint works, including rpcgate.
# Omitted per-chain settings fall back to the CHAINWATCH_* environment defaults.
#
# confirmations: blocks to stay behind head. Ethereum finalizes slowly but
# reorgs deeper than a couple of blocks are rare; L2 sequencers (Base, Arbitrum)
# publish blocks that do not reorg in practice until the L1 batch is posted;
# Polygon PoS has seen reorgs of dozens of blocks, so it gets a deep margin.
chains:
  - id: 1
    name: Ethereum
    rpc_url: https://eth-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}
    explorer_url: https://etherscan.io
    confirmations: 12      # ~2.4 minutes at 12 s blocks
    poll_interval: 12s
    max_block_range: 2000
    large_outflow:         # token = amount in base units
      "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48": "100000000000"   # 100,000 USDC (6 decimals)

  - id: 8453
    name: Base
    rpc_url: https://base-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}
    explorer_url: https://basescan.org
    confirmations: 30      # ~1 minute at 2 s blocks
    poll_interval: 4s
    max_block_range: 2000

  - id: 42161
    name: Arbitrum One
    rpc_url: https://arb-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}
    explorer_url: https://arbiscan.io
    confirmations: 120     # ~30 seconds at 0.25 s blocks
    poll_interval: 4s
    max_block_range: 5000

  - id: 137
    name: Polygon
    rpc_url: https://polygon-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}
    explorer_url: https://polygonscan.com
    confirmations: 128     # ~4.5 minutes at 2 s blocks; Polygon PoS reorgs run deep
    reorg_window: 256
    poll_interval: 6s
    max_block_range: 2000
