# Local stack: Postgres, an anvil dev chain and chainwatch.
#   docker compose -f deploy/docker-compose.yml up -d postgres anvil   # dependencies only (make demo, tests)
#   docker compose -f deploy/docker-compose.yml up -d --build          # everything
# Host ports are overridable to avoid clashes with other local services.
name: chainwatch

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chainwatch
      POSTGRES_PASSWORD: chainwatch
      POSTGRES_DB: chainwatch
    ports:
      - "${CHAINWATCH_PG_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainwatch -d chainwatch"]
      interval: 2s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 256m

  anvil:
    image: ghcr.io/foundry-rs/foundry:stable
    # One block per second so confirmations accumulate like on a real chain.
    entrypoint: ["anvil", "--host", "0.0.0.0", "--block-time", "1"]
    ports:
      - "${CHAINWATCH_ANVIL_PORT:-18545}:8545"
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 2s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 256m

  chainwatch:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      CHAINWATCH_RPC_URL: http://anvil:8545
      CHAINWATCH_DATABASE_URL: postgres://chainwatch:chainwatch@postgres:5432/chainwatch?sslmode=disable
      CHAINWATCH_CONFIRMATIONS: "2"
      CHAINWATCH_START_BLOCK: "0"
      CHAINWATCH_POLL_INTERVAL: 1s
    ports:
      - "${CHAINWATCH_HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      anvil:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128m
